# Evermind — example configuration (0.3)
# Copy to config.yaml and adjust. Three modes:
#   auto     (default) — roles auto-discovered from common file conventions.
#            A fresh install works with NO config at all: just run
#            `python scripts/memory_index.py` (cold start discovers + indexes).
#   manual   — roles come only from the explicit `roles:` paths below
#            (0.2.x-style full control).
#   internal — fixed-layout mode for the maintainers' own vault; roles come
#            from config, no discovery.
#
# YAML-less environments (no PyYAML installed): the built-in fallback parser
# reads this exact file shape — mode, nested `roles:` (inline `[a, b]` lists or
# indented block lists) and the extra sections below. Flat role_* keys also work
# as an alternative (`role_rules: CLAUDE.md, AGENTS.md`). If roles are declared
# but nothing resolves, the script errors out instead of writing an empty index.
mode: auto

# Semantic roles → real files. Each role may hold several paths; order = read order.
# A path may be a FILE (read it) or a DIRECTORY (newest YYYY-MM-DD.* file inside wins).
# In auto mode, roles found by discovery are written to .evermind/discovery.json —
# you can edit that file to override, and `--list` shows what discovery would pick.
roles:
  rules: []        # e.g. ["CLAUDE.md", "AGENTS.md", ".cursor/rules"]
  identity: []     # optional; hosts that inject identity (Hermes/OpenClaw) skip this
  todos: []        # e.g. ["docs/TODO.md", "~/todo.txt"]
  journal: []      # e.g. ["journal"]   (directory → newest dated file)
  profile: []      # optional user-profile file

# Extra L3 files read at the START of EVERY session (beyond roles).
must_read_extra:
  - path: README.md
    name: Project readme
    desc: project context

# Extra L2 files: re-read ONLY when the index flags a change (token savings live here).
tracked_files_extra:
  - path: docs/decisions/
    name: Decisions
    desc: architecture decisions

# Legacy 0.2.x keys (must_read / tracked_files) are migrated automatically:
#   must_read      -> must_read_extra   (stays L3 — read every session)
#   tracked_files  -> tracked_files_extra (stays L2 — change-indexed)

# Where the generated index + state file are written (default: next to the config).
output_index: memory_index.md
output_state: memory_index_state.json
